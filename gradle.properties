org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# Where the demo app reaches the demo server, and the return URL the server
# asks the hosted page to send the user back to. The return URL must be an App
# Link the demo app handles; the defaults work on an emulator after
# `adb reverse tcp:3000 tcp:3000` and approving app.localhost; see README.md.
demo.backendUrl=http://localhost:3000
demo.returnUrl=http://app.localhost:3000/verified
